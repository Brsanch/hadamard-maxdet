[project]
name = "hadamard-maxdet"
version = "0.1.0"
description = "Hadamard maximal determinant problem: search for {-1,+1}-matrices of maximum determinant."
authors = [{ name = "Bryan Sanchez" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "sympy>=1.12",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.7",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "matplotlib>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hadamard_maxdet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "slow: tests that take more than a couple of seconds (parallel-tempering runs, etc.)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "UP"]
ignore = ["E501"]
